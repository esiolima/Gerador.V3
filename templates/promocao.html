<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=700, initial-scale=1.0" />
<title>Promoção</title>

<style>
@font-face {
  font-family: 'Inter';
  src: url('../fonts/Inter-Regular.ttf') format('truetype');
  font-weight: 400;
}
@font-face {
  font-family: 'Inter';
  src: url('../fonts/Inter-Bold.ttf') format('truetype');
  font-weight: 700;
}
@font-face {
  font-family: 'Inter';
  src: url('../fonts/Inter-Black.ttf') format('truetype');
  font-weight: 900;
}

* {
  text-transform: uppercase;
  color: #2b4474;
  box-sizing: border-box;
  font-family: 'Inter', sans-serif;
}

body {
  margin: 0;
  width: 700px;
  height: 1058px;
  background: transparent;
  display: flex;
  justify-content: center;
  align-items: center;
}

.card {
  width: 700px;
  height: 1058px;
  border: 8px solid #e0b84b;
  border-radius: 40px;
  padding: 55px 40px 38px 40px;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  background: #ffffff;
  overflow: hidden;
  position: relative;
}

/* ===== SELO ===== */
.selo {
  position: absolute;
  top: 10px;
  left: 10px;
  width: 117px;
  height: 58.5px;
  background: transparent;
  z-index: 99999;
  pointer-events: none;
}

.selo img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}

.selo img[src=""] {
  display: none;
}

/* ===== TOPO ===== */
.topo {
  display: flex;
  flex-direction: column;
  align-items: center;
  flex: 0 0 auto;
}

.logo {
  width: 100%;
  height: 140px;
  margin-bottom: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.logo img {
  max-width: 280px;
  max-height: 140px;
  object-fit: contain;
}

.logo img[src=""] {
  display: none;
}

.logo:has(img[src=""]),
.logo:not(:has(img)) {
  background: #ffffff;
  border-radius: 16px;
}

.logo:has(img[src=""])::before,
.logo:not(:has(img))::before {
  content: "";
  display: none;
}

.tarja {
  background: #ff7a00;
  color: #ffffff;
  padding: 18px 70px;
  border-radius: 999px;
  font-weight: 700;
  font-size: 42px;
  text-align: center;
  white-space: nowrap;
}

/* ===== BLOCO CENTRAL ===== */
.bloco-central {
  display: flex;
  flex-direction: column;
  align-items: center;
  flex: 1 1 auto;
  min-height: 480px;
}

.fit-text-inner {
  display: block;
}

.texto-topo {
  flex: 1 1 90px;
  min-height: 90px;
  width: 100%;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  text-align: center;
  font-size: 26px;
  max-width: 560px;
  line-height: 1.18;
  margin: 0;
  word-break: break-word;
}

.valor-container {
  width: 100%;
  height: 360px;
  margin: 8px 0;
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.valor-texto {
  font-weight: 900;
  font-size: 480px;
  text-align: center;
  white-space: normal;
  word-break: keep-all;
  overflow-wrap: normal;
  line-height: 0.9;
}

/* ===== INFERIOR ===== */
.bloco-inferior {
  display: flex;
  flex-direction: column;
  align-items: center;
  flex: 2 1 auto;
  min-height: 220px;
}

.complemento {
  flex: 1.2 1 80px;
  min-height: 80px;
  width: 100%;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  text-align: center;
  font-size: 22px;
  max-width: 550px;
  line-height: 1.15;
  word-break: break-word;
}

.legal {
  flex: 0.8 1 55px;
  min-height: 55px;
  width: 100%;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  margin-top: 0;
  text-align: center;
  font-size: 18px;
  max-width: 550px;
  line-height: 1.15;
  word-break: break-word;
}

.rodape {
  flex: 0 0 auto;
  margin-top: 0;
  margin-bottom: 0;
  text-align: center;
  color: #1F3C6E;
}

.uf {
  font-size: 22px;
  font-weight: 700;
  color: #1F3C6E;
}

.segmento-wrapper {
  margin-top: 12px;
  font-size: 18px;
  font-weight: 400;
  color: #1F3C6E;
}
</style>
</head>

<body>

<div class="card">

  <div class="selo">
    <img src="{{SELO}}" alt="Selo" />
  </div>

  <div class="topo">
    <div class="logo">
      <img src="{{LOGO}}" alt="Logo" />
    </div>

    <div class="tarja">PROMOÇÃO</div>
  </div>

  <div class="bloco-central">
    <div class="texto-topo"><span class="fit-text-inner">{{TEXTO}}</span></div>

    <div class="valor-container" id="valor-container">
      <div class="valor-texto" id="valor-texto">
        {{VALOR}}
      </div>
    </div>
  </div>

  <div class="bloco-inferior">
    <div class="complemento"><span class="fit-text-inner">{{COMPLEMENTO}}</span></div>
    <div class="legal"><span class="fit-text-inner">{{LEGAL}}</span></div>

    <div class="rodape">
      <div class="uf">{{URN}}</div>
      <div class="uf">{{UF}}</div>

      <div class="segmento-wrapper" id="segmento-bloco">
        NEGÓCIO DE CLIENTES: {{SEGMENTO}}
      </div>
    </div>
  </div>

</div>

<script>
(function () {
  // Encolhe a fonte de um bloco de texto ate ele caber dentro da propria
  // altura (evita que texto mais longo que o esperado invada o elemento
  // vizinho). Mede o wrapper interno (span), nao o container flex.
  function fitBoxHeight(container, minFontPx) {
    if (!container) return;
    const inner = container.querySelector(".fit-text-inner") || container;

    let fontSize = parseFloat(getComputedStyle(container).fontSize);
    const min = minFontPx;

    while (inner.scrollHeight > container.clientHeight + 1 && fontSize > min) {
      fontSize -= 1;
      container.style.fontSize = fontSize + "px";
    }
  }

  fitBoxHeight(document.querySelector(".texto-topo"), 16);
  fitBoxHeight(document.querySelector(".complemento"), 14);
  fitBoxHeight(document.querySelector(".legal"), 12);

  const container = document.getElementById("valor-container");
  const el = document.getElementById("valor-texto");

  if (container && el) {
    let fontSize = 480;
    const min = 40;

    el.style.fontSize = fontSize + "px";
    el.style.whiteSpace = "normal";
    el.style.wordBreak = "keep-all";
    el.style.overflowWrap = "normal";

    while (
      (el.scrollHeight > container.clientHeight ||
       el.scrollWidth > container.clientWidth) &&
      fontSize > min
    ) {
      fontSize -= 2;
      el.style.fontSize = fontSize + "px";
    }
  }

  const segmento = document.getElementById("segmento-bloco");

  if (segmento) {
    const texto = segmento.textContent ? segmento.textContent.trim() : "";

    if (!texto || texto === "NEGÓCIO DE CLIENTES:") {
      segmento.style.display = "none";
    }
  }
})();
</script>

</body>
</html>
