<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<title>Cupom de Desconto</title>

<style>
@font-face {
  font-family: 'Inter';
  src: url('../fonts/Inter-Regular.ttf') format('truetype');
  font-weight: 400;
}
@font-face {
  font-family: 'Inter';
  src: url('../fonts/Inter-Bold.ttf') format('truetype');
  font-weight: 700;
}
@font-face {
  font-family: 'Inter';
  src: url('../fonts/Inter-Black.ttf') format('truetype');
  font-weight: 900;
}

* {
  box-sizing: border-box;
  font-family: Inter, sans-serif;
  text-transform: uppercase;
}

body {
  margin: 0;
  background: transparent;
  display: flex;
  justify-content: center;
  align-items: center;
}

.card {
  width: 700px;
  height: 1057.5px;
  border: 6px solid #F2C94C;
  border-radius: 48px;
  background: #ffffff;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 20px;
  position: relative;
  color: #1F3C6E;
  overflow: hidden;
}

/* ===== SELO ===== */
.selo {
  position: absolute;
  top: 10px;
  left: 10px;
  width: 117px;
  height: 58.5px;
  z-index: 99999;
  pointer-events: none;
}

.selo img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}

.selo img[src=""] {
  display: none;
}

/* ===== LOGO ===== */
.logo {
  margin-top: 55px;
  height: 140px;
  width: 100%;
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.logo img {
  max-height: 140px;
  max-width: 280px;
  object-fit: contain;
  display: block;
}

.logo img[src=""],
.logo img:not([src]) {
  display: none;
}

/* ===== TARJA ===== */
.tarja {
  background: #16A7E0;
  color: #ffffff;
  font-weight: 700;
  font-size: 42px;
  text-align: center;
  padding: 18px 40px;
  border-radius: 999px;
  margin-top: 22px;
  margin-bottom: 20px;
  white-space: nowrap;
  flex: 0 0 auto;
}

/* ===== TEXTO ===== */
.fit-text-inner {
  display: block;
}

.condicao {
  margin-top: 0;
  margin-bottom: 0;
  max-width: 550px;
  font-size: 28px;
  line-height: 1.15;
  text-align: center;
  flex: 1 1 110px;
  min-height: 110px;
  width: 100%;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}

/* ===== BENEFÍCIO ===== */
.percentual {
  display: flex;
  align-items: flex-end;
  justify-content: center;
  width: 100%;
  max-width: 500px; /* 🔥 LIMITADOR PARA IGUALAR COM OS OUTROS */
  margin-top: 8px;
  flex: 0 0 auto;
}

.numero,
.percent {
  font-weight: 900;
  font-size: clamp(120px, 22vw, 240px); /* 🔥 AJUSTADO */
  line-height: 0.85;
}

.percent {
  margin-left: 6px;
}

.desconto {
  margin-top: 5px;
  font-size: clamp(40px, 5vw, 60px);
  font-weight: 700;
  flex: 0 0 auto;
}

.complemento {
  flex: 1.2 1 40px;
  min-height: 40px;
  width: 100%;
  margin-top: 8px;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  text-align: center;
  font-size: 22px;
  line-height: 1.2;
}

.legal {
  flex: 0.8 1 40px;
  min-height: 40px;
  width: 100%;
  margin-bottom: 8px;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  text-align: center;
  font-size: 16px;
  opacity: 0.8;
}

/* ===== CUPOM BOX ===== */
.cupom-box {
  margin-top: 4px;
  margin-bottom: 12px;
  width: 620px;
  height: 130px;
  background: #16A7E0;
  border-radius: 16px;
  display: flex;
  overflow: hidden;
  flex: 0 0 auto;
}

/* LADO ESQUERDO */
.cupom-label {
  width: 80px;
  background: rgba(0,0,0,0.1);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.cupom-label span {
  writing-mode: vertical-rl;
  transform: rotate(180deg);
  font-size: 22px;
  font-weight: 900;
  color: #ffffff;
  letter-spacing: 2px;
}

/* CÓDIGO */
.cupom-codigo {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding-left: 45px;
  padding-right: 45px;
  overflow: hidden;
  text-align: center;
}

/* TEXTO DO CUPOM */
#cupom-text {
  display: block;
  max-width: 100%;
  font-weight: 900;
  color: #ffffff;
  font-size: 72px;
  line-height: 1;
  text-align: center;
  white-space: nowrap;
}

/* ===== RODAPÉ ===== */
.rodape {
  flex: 0 0 auto;
  margin-bottom: 38px;
  text-align: center;
  width: 100%;
}

.uf {
  font-size: 22px;
  font-weight: 700;
}

.segmento {
  margin-top: 12px;
  font-size: 18px;
  font-weight: 400;
}
</style>
</head>

<body>
<div class="card">

  <div class="selo">
    <img src="{{SELO}}" alt="Selo">
  </div>

  <div class="logo">
    <img src="{{LOGO}}" alt="Logo">
  </div>

  <div class="tarja">
    CUPOM DE DESCONTO
  </div>

  <div class="condicao"><span class="fit-text-inner">{{TEXTO}}</span></div>

  <div class="percentual">
    <div class="numero">{{VALOR}}</div>
    <div class="percent">%</div>
  </div>

  <div class="desconto">DE DESCONTO</div>

  <div class="complemento"><span class="fit-text-inner">{{COMPLEMENTO}}</span></div>

  <div class="legal"><span class="fit-text-inner">{{LEGAL}}</span></div>

  <div class="cupom-box">
    <div class="cupom-label">
      <span>CUPOM</span>
    </div>

    <div class="cupom-codigo">
      <span id="cupom-text">{{CUPOM}}</span>
    </div>
  </div>

  <div class="rodape">
    <div class="uf">{{URN}}</div>
    <div class="uf">{{UF}}</div>
    <div class="segmento" id="segmento-bloco">
      NEGÓCIO DE CLIENTES: {{SEGMENTO}}
    </div>
  </div>

</div>

<script>
window.addEventListener("load", function () {
  try {
    // Encolhe a fonte de um bloco de texto ate ele caber dentro da propria
    // altura (evita que texto mais longo que o esperado invada o elemento
    // vizinho, ja que estes blocos sao elasticos mas tem um minimo fixo).
    // Mede o elemento INTERNO (span), nao o container flex — scrollHeight
    // de um container flex com texto solto (sem elemento proprio) nao
    // reflete o overflow real quando o conteudo estoura a altura.
    function fitBoxHeight(container, minFontPx) {
      if (!container) return;
      const inner = container.querySelector(".fit-text-inner") || container;

      let fontSize = parseFloat(getComputedStyle(container).fontSize);
      const min = minFontPx;

      while (inner.scrollHeight > container.clientHeight + 1 && fontSize > min) {
        fontSize -= 1;
        container.style.fontSize = fontSize + "px";
      }
    }

    fitBoxHeight(document.querySelector(".condicao"), 16);
    fitBoxHeight(document.querySelector(".complemento"), 14);
    fitBoxHeight(document.querySelector(".legal"), 12);

    const el = document.getElementById("cupom-text");

    if (el && el.parentElement) {
      const container = el.parentElement;
      const containerStyle = getComputedStyle(container);
      const paddingX =
        parseFloat(containerStyle.paddingLeft || "0") +
        parseFloat(containerStyle.paddingRight || "0");
      const maxWidth = container.clientWidth - paddingX;

      let fontSize = 72;
      const min = 12;

      el.style.fontSize = fontSize + "px";

      while (el.scrollWidth > maxWidth && fontSize > min) {
        fontSize -= 1;
        el.style.fontSize = fontSize + "px";
      }
    }

    const segmento = document.getElementById("segmento-bloco");

    if (segmento) {
      const texto = (segmento.textContent || "").trim();

      if (!texto || texto === "NEGÓCIO DE CLIENTES:") {
        segmento.style.display = "none";
      }
    }
  } catch (error) {
    console.error("[cupom.html] erro:", error);
  }
});
</script>

</body>
</html>
